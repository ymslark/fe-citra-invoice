services:
  fe-citra-invoice:
    build:
      context: .
    image: fe-citra-invoice:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
      BASE_URL_FE: ${BASE_URL_FE:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-Citra Invoice}
      DEBUG: ${DEBUG:-false}
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
